name: Sync Live Excel Data

on:
  repository_dispatch:
    types: [excel-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Write approved public tracker fields
        env:
          EXCEL_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os
          payload = json.loads(os.environ["EXCEL_PAYLOAD"])
          source = payload.get("data", payload)
          if isinstance(source, str):
              source = json.loads(source)
          allowed = [
              "dateReceived", "stakeholderName", "donationType", "description",
              "cashAmount", "inKindValue", "totalValue", "programProject",
              "beneficiarySchools", "numberOfBeneficiaries", "status"
          ]
          donations = [
              {key: row.get(key) for key in allowed}
              for row in source.get("donations", [])
              if isinstance(row, dict)
          ]
          raw_stakeholders = source.get("stakeholders", [])
          stakeholder_keys = [
              "stakeholderName", "Stakeholder Name", "Name of Stakeholder",
              "Partner Name", "Name of Partner", "Stakeholder/Partner Name"
          ]
          seen = set()
          stakeholders = []
          for row in raw_stakeholders:
              if not isinstance(row, dict):
                  continue
              name = next((str(row.get(key, "")).strip() for key in stakeholder_keys if str(row.get(key, "")).strip()), "")
              normalized = " ".join(name.lower().split())
              if name and normalized not in seen:
                  seen.add(normalized)
                  stakeholders.append({"stakeholderName": name})
          public_data = {
              "updatedAt": source.get("updatedAt"),
              "donations": donations,
              "stakeholderCount": source.get("stakeholderCount"),
              "stakeholders": stakeholders,
              "projects": []
          }
          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(public_data, file, ensure_ascii=False, indent=2)
          PY

      - name: Commit updated website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update website data from live Excel"
            git push
          fi
